  flutter_to_pdf: ^0.4.1
  path_provider: ^2.1.2
  file_picker: ^13.1.0
  open_file: ^4.0.0
  chips_choice: ^3.0.1
  camera: ^0.12.1
  image: ^4.0.15
  image_watermark: ^0.1.0
  flutter_image_compress: ^2.5.1
  worldtime: ^1.4.2
