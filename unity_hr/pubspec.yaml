  focus_detector: ^2.0.1
  connectivity_plus: ^7.3.1
  dropdown_button2: ^3.1.0
  google_maps_flutter: ^2.12.3
  custom_date_range_picker: ^1.0.10
  cached_network: ^2.1.0
  cached_network_image: ^4.0.0
  multiselect_dropdown_flutter: ^0.0.7
  image_picker: ^1.2.0
  image_cropper_platform_interface: ^8.0.0
  image_cropper: ^12.2.1
  pinput: ^6.0.2
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  lottie: ^3.0.0
  calendar_date_picker2: ^3.0.0
  flutter_svg: ^2.0.5
  syncfusion_flutter_datepicker: ^34.2.8
