  readmore: ^3.0.0
  flutter_timezone: ^5.1.0
  flutter_widget_from_html: ^0.17.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: SFPRODISPLAYREGULAR
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
    - family: SFPRODISPLAYMEDIUM
      fonts:
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
    - family: SFPRODISPLAYBOLD
      fonts:
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
